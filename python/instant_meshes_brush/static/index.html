<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Instant Meshes - brush guidance</title>
    <!--
      This document is served from /viewer, not from the directory it lives in,
      so every asset URL has to name the mount explicitly; a relative URL would
      resolve against the site root and 404.  The mount is /imb-assets rather
      than the obvious /static because Gradio serves its own fonts and scripts
      from /static, and the first matching route wins.
    -->
    <link rel="stylesheet" href="/imb-assets/style.css" />
    <!--
      OrbitControls imports the bare specifier 'three', so the vendored module
      has to be reachable under that name before any module script runs.
    -->
    <script type="importmap">
      { "imports": { "three": "/imb-assets/vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <!--
      Every control lives inside this document, so the viewer is a complete
      application behind one <iframe src="/viewer?session=...">.  A host page
      embeds it without reproducing any of the UI, and nothing here depends on
      Gradio being the host.

      The panel carries only what the user acts on; everything the user merely
      reads -- what is loaded, what the tool does, what the solver is doing --
      sits in the stage's bottom-left corner, where it costs no panel height.
    -->
    <div id="app">
      <aside id="panel" aria-label="Controls">
        <header id="panel-head">
          <span class="brand">Instant Meshes</span>
          <span id="link" class="dot" title="Connection state"></span>
        </header>

        <div id="panel-scroll">
          <!-- Mesh ------------------------------------------------------- -->
          <section class="block">
            <h2>Mesh</h2>
            <button class="wide primary hero" id="btn-open"
              data-hint="Load an FBX, OBJ, glTF, glB, PLY, STL, OFF or DAE file. To see its textures, select them together with the model (with the .mtl of an OBJ, the .bin of a glTF), pick one zip holding it all, or drop the model's folder anywhere here.&#10;&#10;The field is solved for you as soon as it is in, so the grid preview appears without pressing anything else.">
              Import mesh
            </button>
            <input type="file" id="file-input" multiple hidden />
            <p class="row muted" id="mesh-line" hidden>
              <span id="mesh-name"></span>
              <span id="mesh-stats"></span>
            </p>
            <!-- None, All, and one button per kind of map the file carried,
                 filled in from script because which there are is a property
                 of the model. Absent entirely for the formats that carry none. -->
            <div class="textures" id="texture-slots" role="radiogroup"
                 aria-label="Texture maps" hidden></div>
          </section>

          <!-- The separators are flex items, not borders: the panel's spare
               height is shared between them, so the sections spread out and
               the rule stays in the middle of the space it divides. -->
          <hr class="gap" />

          <!-- Tools ------------------------------------------------------ -->
          <section class="block">
            <h2>Brush tools</h2>
            <div class="tools" role="radiogroup" aria-label="Tools">
              <button class="tool" data-tool="comb" role="radio" aria-checked="true"
                data-hint="Orientation comb (C). Left-drag across the surface to turn the edge flow so it follows your stroke. This is the default: left-drag always combs unless you pick another brush.">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5.5c2.3-2.6 4.6-2.6 7 0s4.7 2.6 7 0" /><path d="M3 8v4M6.5 8.6v4M10 8.6v4M13.5 8v4" /></svg>
                <span class="label">Comb</span><kbd>C</kbd>
              </button>
              <button class="tool" data-tool="edge" role="radio" aria-checked="false"
                data-hint="Edge brush (E). Pins an actual edge of the output mesh onto your stroke, instead of only steering the flow near it.">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13L14 3" /><rect x="0.8" y="11.8" width="2.6" height="2.6" /><rect x="12.6" y="1.6" width="2.6" height="2.6" /></svg>
                <span class="label">Edge brush</span><kbd>E</kbd>
              </button>
              <button class="tool" data-tool="orient-attractor" role="radio" aria-checked="false"
                data-hint="Drag an orientation singularity. Start the stroke ON a red or blue marker and pull it where you want it.">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5c5-1 8.5-3.5 9.5-8.5" /><path d="M7.5 3.2h3.8V7" /><circle cx="3.4" cy="12.6" r="1.6" /></svg>
                <span class="label">Orient. attractor</span>
              </button>
              <button class="tool" data-tool="pos-attractor" role="radio" aria-checked="false"
                data-hint="Drag a position singularity. Start the stroke ON a marker, as with the orientation attractor.">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5h13M1.5 10.5h13M5.5 1.5v13M10.5 1.5v13" /><circle cx="10.5" cy="5.5" r="2.1" class="fill" /></svg>
                <span class="label">Pos. attractor</span>
              </button>
            </div>
            <div class="row">
              <span id="stroke-count" class="muted">No strokes</span>
              <button id="btn-clear" class="link-button" disabled
                data-hint="Remove every stroke and re-solve without them. To delete one stroke, click the dot at its start; Ctrl+Z undoes the last one.">
                Clear
              </button>
              <!-- How many markers are on screen right now, which is the one
                   number the attractors are aimed at. -->
              <span id="singularity-count" class="muted push" hidden></span>
            </div>
            <!-- The two overlays a brush aims at, under the brushes that aim
                 at them: the grid is what combing turns, and the markers are
                 what an attractor drags. -->
            <div class="row">
              <label class="check"><input type="checkbox" data-layer="grid" checked
                data-hint="The red grid showing where the edge loops will run. It is drawn on the input surface, so it is only visible while that is." /><span>Field grid</span></label>
              <label class="check push"><input type="checkbox" data-layer="singularities"
                data-hint="The red and blue dots marking where the grid cannot stay regular -- where three or five edges meet instead of four. Picking either attractor brush turns them on, since those drag a marker you have to be able to see." /><span>Singularities</span></label>
            </div>
          </section>

          <hr class="gap" />

          <!-- Resolution and views --------------------------------------- -->
          <!-- No heading: these three are how much of the model you are
               looking at and which form of it, which the controls say for
               themselves. -->
          <section class="block">
            <label class="field" for="target">
              <span>Target vertex count</span>
              <input type="number" id="target" min="500" max="60000" step="10" value="1000"
                data-hint="Roughly how many vertices the output should have, between 500 and 60,000. Lower means bigger quads. The model is rebuilt and re-solved a moment after you stop changing it; your strokes are carried across, so it is safe to keep adjusting." />
            </label>
            <!-- Logarithmic; see panel.js. Its own units are slider steps, not
                 vertices, so the useful low end is not crushed into 5 pixels. -->
            <input type="range" id="target-range" min="0" max="1000" step="1" value="0" />

            <!-- The UV atlas, as one control. Touching it selects the view
                 that shows what it does, since the setting means nothing
                 except as a picture of the layout it produces. -->
            <div id="uv-zone" hidden>
              <div class="field">
                <span id="uv-label">UV chunks</span>
                <span id="uv-charts"></span>
              </div>
              <input type="range" id="uv-leniency" min="0" max="100" step="1" value="50"
                data-hint="How far xatlas may stretch one UV chunk before it cuts a seam and starts another. Right means fewer, larger chunks with more distortion; left means more, smaller ones that each stay closer to their true shape.&#10;&#10;Dragging this switches the view to Result UV, so you can see what it did." />
            </div>

            <!-- One view at a time: the first two occupy the same space, and
                 the input in front of the output is what made an extracted
                 mesh look like it had never appeared. -->
            <div class="segmented" role="radiogroup" aria-label="View">
              <button class="seg" data-surface="mesh" role="radio" aria-checked="true"
                data-hint="Show the model you imported, with the field grid on it. This is the surface you brush on, so drawing a stroke switches back here.">
                <span class="label">Input</span><kbd>1</kbd>
              </button>
              <button class="seg" data-surface="output" role="radio" aria-checked="false"
                data-hint="Show the extracted quad mesh. It is built on demand, so choosing this after brushing rebuilds it from the field you have just changed.">
                <span class="label">Result</span><kbd>2</kbd>
              </button>
              <button class="seg" data-surface="uv" role="radio" aria-checked="false"
                data-hint="Show the result flattened into its texture space, one colour per UV chunk. Built on demand like the result itself.">
                <span class="label">Result UV</span><kbd>3</kbd>
              </button>
            </div>
          </section>

          <hr class="gap" />

          <!-- Output ----------------------------------------------------- -->
          <section class="block">
            <h2>Output mesh</h2>
            <select id="symmetry"
              data-hint="The symmetry of the output. Quads (4-RoSy, 4-PoSy) is the usual choice; triangles use 6-RoSy, 6-PoSy. Changing this rebuilds and re-solves straight away.">
              <option value="4,4" selected>Quads (4-RoSy, 4-PoSy)</option>
              <option value="6,3">Triangles (6-RoSy, 6-PoSy)</option>
              <option value="2,4">Quads, 2-RoSy</option>
            </select>

            <!-- Four settings of the same kind -- each one changes how the
                 field is solved, so each one rebuilds -- and four checkboxes
                 down the panel cost four rows to say it. -->
            <div class="toggles" role="group" aria-label="Field options">
              <button class="toggle" data-opt="extrinsic" aria-pressed="true"
                data-hint="Smooth the flow through space rather than across the surface -- 'extrinsic' smoothing. It gives a calmer, more even grid and is what you normally want; turning it off lets the flow follow the surface's own curvature more closely, at the cost of more swirl.">Smooth<br />Flow</button>
              <button class="toggle" data-opt="boundaries" aria-pressed="false"
                data-hint="Make edge loops run parallel to the open edges of the model, where it has any.">Follow<br />Borders</button>
              <button class="toggle" data-opt="creases" aria-pressed="false"
                data-hint="Keep sharp edges sharp instead of smoothing across them.">Sharp<br />Creases</button>
              <button class="toggle" data-opt="pure-quad" aria-pressed="false"
                data-hint="Subdivide so the result contains quads only, with no triangles. The subdivision splits every quad into four, so the field is aimed at a quarter of the target above and the count you asked for is still what comes out.&#10;&#10;An exported OBJ still writes the few per cent of quads a UV seam runs through as their two triangles -- the only way they can carry it.">Force<br />Quads</button>
            </div>

            <div class="field">
              <label for="smoothing">Smoothing</label>
              <input type="number" id="smoothing" min="0" max="10" step="1" value="2"
                data-hint="Reprojection passes applied to the extracted mesh. More means a smoother result that follows the original surface less tightly." />
              <select id="format" aria-label="File format"
                data-hint="The file Export writes. OBJ is the safer choice: a quad-dominant result contains triangles too, and not every reader accepts a PLY with mixed face sizes. Pure quad mesh makes PLY safe.">
                <option value="obj" selected>obj</option>
                <option value="ply">ply</option>
              </select>
            </div>

            <button class="wide hero go" id="btn-export"
              data-hint="Build the quad mesh from the solved field, write it out and download it. An OBJ carries the UV layout with it.">Export</button>
            <p id="output-stats" class="muted" hidden></p>
            <!-- Clicked from script to start the download; never shown. -->
            <a id="download" hidden download></a>
          </section>
        </div>
      </aside>

      <div id="stage">
        <canvas id="view"></canvas>
        <!-- The in-progress stroke is a pure 2D screen polyline, as in the
             native viewer's NanoVG overlay, so it lives on its own 2D canvas. -->
        <canvas id="overlay"></canvas>

        <!-- One line: what the brush in your hand is, and what it does. Never
             takes the pointer, so a stroke drawn across it reaches the canvas
             underneath. Anything the user has to act on is in the panel; this
             corner only ever answers "what happens if I drag now?". -->
        <div id="readout">
          <p id="status">
            <span id="tool-name">Orientation Comb</span>
            <span id="status-text">Import a mesh to begin.</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Hover help. A single floating element rather than per-control bubbles,
         so a hint is never clipped by the scrolling panel. -->
    <div id="tip" role="tooltip" hidden></div>

    <!-- main.js and its siblings import each other relatively, which resolves
         correctly once this entry point is loaded from the mount. -->
    <script type="module" src="/imb-assets/main.js"></script>
  </body>
</html>
