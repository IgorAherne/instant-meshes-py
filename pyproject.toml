[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "instant-meshes-brush"
version = "0.1.0"
description = "Instant Meshes field-aligned remeshing with browser-based brush guidance"
readme = "README_PYTHON.md"
requires-python = ">=3.9"
license = { file = "LICENSE.txt" }
authors = [{ name = "Instant Meshes contributors" }]
keywords = ["remeshing", "quad", "retopology", "geometry-processing", "gradio"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# Everything needed to run the browser UI. The C++ core alone needs only numpy.
app = [
    "gradio>=4.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "trimesh>=4.0",
    # Decodes the texture maps a glTF or an FBX carries, and shrinks them to
    # preview size. trimesh pulls it in for glTF anyway; named here because
    # assets.py needs it for every format, not just that one.
    "pillow>=9.0",
    # UV unwrapping of the extracted mesh. Optional at runtime -- the viewer
    # hides its UV control where this is missing -- but a remesher that cannot
    # hand back a texture space is half a retopology tool, so it ships with it.
    "xatlas>=0.0.9",
    # FBX, which no pure-Python reader covers. Optional at runtime: without it
    # every other format still loads and an FBX is refused by name.
    "assimp-py>=1.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
instant-meshes-brush = "instant_meshes_brush.__main__:main"

[project.urls]
Homepage = "https://github.com/wjakob/instant-meshes"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/instant_meshes_brush"]
sdist.exclude = [
    "ext/nanogui",
    "ext/tbb",
    "ext/eigen",
    "build",
    "build_test",
    ".venv",
    "resources/screenshot.jpg",
]

[tool.scikit-build.cmake.define]
INSTANT_MESHES_BUILD_PYTHON = "ON"
INSTANT_MESHES_BUILD_GUI = "OFF"
INSTANT_MESHES_BUILD_CLI = "OFF"

[tool.cibuildwheel]
# manylinux_2_28 ships GCC 12, which is new enough for the C++17 core.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build-verbosity = 1

[tool.cibuildwheel.macos]
# Eigen's C++17 paths need a deployment target with complete <charconv>.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realasset: reads model files that exist only on the author's machine; skipped elsewhere",
]
